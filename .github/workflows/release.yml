name: Release

# Publishes a downloadable Alakazam package and a GitHub release.
#
# Runs when a version tag is pushed, in this repository's own capital-V
# convention (V0.0.1 ... V0.3.1 to date):
#
#     git tag -a V0.4.0 -m "Alakazam 0.4.0"
#     git push origin V0.4.0
#
# Lowercase v works too; both are accepted by the trigger and the version
# check below.
#
# or on demand from the Actions tab, where a version has to be supplied by
# hand (used for a dry run: "Run workflow" with draft left on produces a
# draft release that can be inspected and deleted without announcing
# anything).
#
# The package is the tracked repository tree PLUS the rendered manual.
# manual/manual.html is not in version control (it embeds every figure of
# the manual, see manual/.gitignore) but is exactly what a user downloading
# a release needs: the in-app Help button shows it, which on a release is a
# copy, where a working copy has to render it with Quarto, which the user
# may not have. manual/manual.pdf is committed, but is rendered again here
# so the package cannot ship one older than its text; it is also attached
# to the release on its own. Everything else is taken straight from the git
# index, so gitignored working data (Data/, eeglab/, node_modules/) cannot
# leak into a published archive.

on:
  push:
    tags:
      # Both spellings. These globs are matched case-sensitively, so 'v*'
      # alone would silently ignore this repository's own convention: every
      # tag it has ever carried (V0.0.1 ... V0.3.1) begins with a capital V,
      # and a push of the next one would produce no run and no error at all.
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, including the leading V (e.g. V0.4.0)'
        required: true
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write   # required to create the release and upload the asset

# One release at a time, repository-wide. Two tags pushed in quick succession
# would otherwise run concurrently and could race on the same release: both
# see "does not exist yet", both call `gh release create`, and the loser
# fails. A fixed group (rather than one per ref) is what serialises them,
# since different tags are different refs. Never cancel a run in flight --
# a half-published release is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Not needed for the release notes: `gh release create
          # --generate-notes` is resolved server-side by the GitHub API from
          # the tag metadata, so nothing here reads the local history to
          # build them. The only local git command below is `git archive
          # HEAD`, which a depth-1 clone would satisfy just as well. The
          # full history is kept deliberately, as a conservative default so
          # that any later step that does want history (a changelog diff
          # against the previous tag, say) is not silently broken by a
          # grafted shallow clone -- at the cost of a slower checkout. Drop
          # this to the default if that trade stops being worth it.
          fetch-depth: 0

      - name: Resolve the version
        id: version
        # Passed as environment variables rather than interpolated into the
        # script below. A `${{ }}` expression is substituted textually before
        # bash ever parses the line, so a dispatch input containing shell
        # metacharacters would be executed rather than assigned; read through
        # the environment, the value is only ever data.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # This repository's own tags are capital-V (V0.3.1 and friends),
          # so both spellings are accepted here.
          case "$VERSION" in
            v*|V*) ;;
            *) echo "::error::Version must start with 'v' or 'V' (got '$VERSION')."; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the manual
        working-directory: manual
        # HTML for the in-app Help, and a PDF typeset by the Typst that
        # Quarto bundles, with the fonts in manual/fonts, so no LaTeX is
        # needed.
        run: |
          quarto render manual.qmd --to html
          quarto render manual.qmd --to typst
          ls -l manual.html manual.pdf

      - name: Assemble the package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NAME="Alakazam-${VERSION}"
          mkdir -p "stage/${NAME}"
          # git archive emits the tracked tree only, so nothing ignored
          # (Data/, eeglab/, node_modules/) can end up in the package.
          git archive HEAD | tar -x -C "stage/${NAME}"
          # The one deliberate addition: the rendered manual.
          cp manual/manual.html manual/manual.pdf "stage/${NAME}/manual/"
          # Stamp the version the package was published from. A release
          # package has no .git directory, so `git describe` cannot tell an
          # user what they are running; alakazamVersion reads this file
          # first for exactly that reason, and the About box shows it.
          printf '%s\n' "${VERSION}" > "stage/${NAME}/VERSION"
          ( cd stage && zip -qr "../${NAME}.zip" "${NAME}" )
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "zip=${NAME}.zip" >> "$GITHUB_OUTPUT"
          cp manual/manual.pdf "Alakazam-manual-${VERSION}.pdf"
          echo "pdf=Alakazam-manual-${VERSION}.pdf" >> "$GITHUB_OUTPUT"
          ls -lh "${NAME}.zip" "Alakazam-manual-${VERSION}.pdf"

      - name: Verify the package contents
        env:
          ZIP: ${{ steps.package.outputs.zip }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          # A release that silently omits the manual, or that ships a
          # participant's data, is worth failing the build over rather than
          # discovering after publication.
          unzip -l "$ZIP" > listing.txt
          grep -q "${NAME}/manual/manual.html" listing.txt \
            || { echo "::error::The rendered manual (HTML) is missing from the package."; exit 1; }
          grep -q "${NAME}/manual/manual.pdf" listing.txt \
            || { echo "::error::The manual PDF is missing from the package."; exit 1; }
          grep -q "${NAME}/startAlakazam.m" listing.txt \
            || { echo "::error::startAlakazam.m is missing from the package."; exit 1; }
          # Without this the About box silently falls back to whatever
          # constant happened to be committed, which is the stale number
          # the VERSION file exists to replace.
          grep -q "${NAME}/VERSION" listing.txt \
            || { echo "::error::The VERSION stamp is missing from the package."; exit 1; }
          if grep -Eq "${NAME}/(Data/|eeglab/|src/(help|webtree)/node_modules/)" listing.txt; then
            echo "::error::The package contains data or dependencies that must not be published."
            exit 1
          fi
          echo "Package contents look correct."

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
          PDF: ${{ steps.package.outputs.pdf }}
          DRAFT: ${{ inputs.draft }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          NOTES_FILE=notes.md
          cat > "$NOTES_FILE" <<'EOF'
          ## Installing

          Download and unzip the attached archive, then in MATLAB:

              cd Alakazam-<version>
              startAlakazam

          EEGLAB and the other toolkits are not included; they are installed
          on first run, or obtained as described in `dependencies.md`. The
          example datasets are not included either (see `DATA.md`).

          The manual is included, as HTML for the **Help** button on the
          Alakazam tab and as a PDF, which is also attached to this release.

          EOF
          # Whether THIS run is meant to leave a draft behind. Only the manual
          # dry run is; a tag push always publishes.
          WANT_DRAFT=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRAFT" = "true" ]; then
            WANT_DRAFT=true
          fi

          # An array, not a string: the title contains a space, and an
          # unquoted "$FLAGS" would split it into two arguments and leave
          # the version as a stray positional.
          #
          # --target pins the release to the exact commit that was packaged a
          # few steps above. Without it gh defaults to the repository's
          # DEFAULT branch, so a dispatch run from Development would archive
          # Development's tree but create the tag on main -- the shipped zip
          # and the tag would name different commits. GitHub ignores the
          # target when the tag already exists, which is the tag-push case.
          FLAGS=(--title "Alakazam ${VERSION}" --notes-file "$NOTES_FILE"
                 --generate-notes --target "$GITHUB_SHA")
          if [ "$WANT_DRAFT" = "true" ]; then
            FLAGS+=(--draft)
          fi

          # Upload to an existing release rather than failing, so a
          # corrected re-run is possible without deleting it by hand.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; uploading the asset to it."
            gh release upload "$VERSION" "$ZIP" "$PDF" --clobber
            # `gh release view` resolves DRAFTS as well as published releases
            # (it runs a draft lookup alongside the by-tag one), so this branch
            # is also reached by a leftover dry-run draft -- not just by a
            # genuine re-run. Uploading and stopping there would publish
            # nothing: the run goes green, the tag exists, and the release
            # stays a draft that only people with push access can see. This
            # branch never applied "${FLAGS[@]}", so the draft flag, title and
            # notes were all skipped; promote and repopulate them here.
            IS_DRAFT="$(gh release view "$VERSION" --json isDraft -q .isDraft)"
            if [ "$IS_DRAFT" = "true" ] && [ "$WANT_DRAFT" = "false" ]; then
              echo "Promoting the existing draft $VERSION to a published release."
              # `gh release edit` has no --generate-notes, so the auto-generated
              # commit changelog is not reproduced on this path; the hand-written
              # notes above are restored, which is the part that matters.
              gh release edit "$VERSION" \
                --draft=false \
                --title "Alakazam ${VERSION}" \
                --notes-file "$NOTES_FILE"
            fi
          else
            gh release create "$VERSION" "$ZIP" "$PDF" "${FLAGS[@]}"
          fi
